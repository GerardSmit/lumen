# Operating-system services shared by the JS and Python runtimes: the file-system primitives
# (descriptor table, stat, readdir, mkdir -p, ...) and the errno mapping. Plain Rust arguments and
# results, no engine types. lumen-common stays OS-free; everything that calls libc lives here.
[package]
name = "lumen-os"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
