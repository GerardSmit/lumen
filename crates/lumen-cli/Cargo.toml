# The node/deno-style entrypoint: dispatches repl / run-file / -e eval over the assembled
# runtime. The binary is `lumen-cli` for now — the engine's own `lumen` bin (the test262 host
# that test262.fyi runs) keeps its name until renaming is coordinated.
[package]
name = "lumen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen = { path = "../lumen" }
lumen-aot = { path = "../lumen-aot" }
lumen-host = { path = "../lumen-host" }
lumen-repl = { path = "../lumen-repl" }
lumen-runtime = { path = "../lumen-runtime" }

[features]
default = ["typed"]
# `lumen typed` analysis modes (the engine's typed-tier checker); `--strip` works without it.
typed = ["lumen/typed"]
bundled-sqlite = ["lumen-runtime/bundled-sqlite"]
# Exact allocator counters in the `LUMEN_MEM_STATS=1` report (costs a few atomics per allocation).
mem-stats = ["lumen/mem-stats"]
# Diagnostic builds: expose individual allocations/frees to memory sanitizers.
system-allocator = []

[lints]
workspace = true
