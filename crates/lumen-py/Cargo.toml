# lumen-py: a from-scratch Python 3 implementation (lexer, parser, bytecode compiler, VM).
# Std-only, like the JS engine.
[package]
name = "lumen-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Doc comments on natives are their Python docstrings (CPython's text, indented examples
# included), not Rust examples.
[lib]
doctest = false

[[bin]]
name = "lumen-py"
path = "src/main.rs"

[features]
# Embed every vendored stdlib module, ignoring `stdlib-exclude.txt`.
py-stdlib-full = []
# Keep comments in the embedded stdlib sources (they are stripped by default, so
# `inspect.getsource` of a stdlib function omits them; line numbers are unchanged either way).
py-stdlib-comments = []
# Embed no stdlib: read it from a directory at run time (`LUMEN_PY_STDLIB`, or
# `frozen::set_external_dir`).
py-stdlib-external = []

[lints]
workspace = true

[dependencies]
lumen-common = { path = "../lumen-common", features = ["hash", "compress"] }
lumen-os = { path = "../lumen-os" }
lumen-bind = { path = "../lumen-bind" }

[build-dependencies]
lumen-common = { path = "../lumen-common", features = ["compress"] }

[dev-dependencies]
# Only for tests/dual_lang.rs: one `#[op]` bound into both engines.
lumen = { path = "../lumen", default-features = false, features = ["embed"] }
