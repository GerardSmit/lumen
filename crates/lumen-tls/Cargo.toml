[package]
name = "lumen-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Unix dlopens the system OpenSSL and needs no crates. Everywhere else (Windows) TLS comes from
# rustls on the ring provider, trusting the operating system's certificate store.
[target.'cfg(not(unix))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"

[target.'cfg(not(unix))'.dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
