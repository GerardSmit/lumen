[package]
name = "lumen-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Desktop Unix keeps its dlopen OpenSSL transport. Rustls is also built there for its
# transport-free client state machine, which the managed kernel drives over its own sockets.
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(all(any(not(unix), target_os = "android"), not(target_os = "none")))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
