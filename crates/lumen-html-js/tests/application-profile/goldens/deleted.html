<body style="margin:0"><style>body{margin:0;font-family:Arial,sans-serif;color:#333}main{width:280px;margin:8px auto}h1{margin:0 0 6px;font-size:24px;text-align:center}#new-todo{width:150px}button{margin:2px;padding:2px 5px;font-size:12px}ul{list-style:none;margin:8px 0;padding:0}li{padding:3px 0;border-bottom:1px solid #ddd}li.completed label{text-decoration:line-through;color:#888}.editor.hidden{display:none}nav{margin-top:6px}#count{margin:4px 0;font-size:12px}</style><div id="app"><main id="todos" class="todoapp"><h1>todos</h1><div id="entry"><input id="new-todo" type="text" placeholder="What needs to be done?" value=""><button id="add" type="button">Add</button><button id="reverse" type="button">Reverse</button></div><ul id="todo-list"></ul><nav id="filters"><button id="filter-all" type="button" aria-pressed="false">All</button><button id="filter-active" type="button" aria-pressed="false">Active</button><button id="filter-completed" type="button" aria-pressed="true">Completed</button></nav><p id="count">2 items left</p></main></div></body>
