[package]
name = "lumen-html-js"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["bundled-fonts", "compiler"]
# Select how build.rs precompiles the Performance Timeline glue (see `performance_extension`):
# bytecode with `compiler`, a native AOT blob with `aot-native`, source evaluation with neither.
compiler = []
aot-native = ["dep:lumen-aot"]
bundled-fonts = ["lumen-html-text/bundled-fonts", "lumen-html-image/bundled-fonts"]

[dependencies]
lumen = { path = "../lumen", default-features = false, features = ["embed"] }
lumen-bind = { path = "../lumen-bind" }
lumen-host = { path = "../lumen-host", default-features = false }
lumen-html = { path = "../lumen-html" }
lumen-html-image = { path = "../lumen-html-image", default-features = false }
lumen-html-text = { path = "../lumen-html-text", default-features = false, features = ["std"] }
lumen-common = { path = "../lumen-common", features = ["cookies", "csp", "object-mime"] }
lumen-timers = { path = "../lumen-timers" }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }

[build-dependencies]
lumen = { path = "../lumen", default-features = false, features = ["compiler"] }
lumen-aot = { path = "../lumen-aot", features = ["native"], optional = true }

[dev-dependencies]
lumen = { path = "../lumen", default-features = false, features = ["embed", "compiler"] }
lumen-runtime = { path = "../lumen-runtime" }
lumen-os = { path = "../lumen-os" }

[[test]]
name = "frameworks"
path = "tests/frameworks/main.rs"

[lints]
workspace = true
