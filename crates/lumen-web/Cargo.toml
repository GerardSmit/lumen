# WinterTC "Minimum Common Web Platform API" op crate: Event/AbortController, TextEncoder/
# TextDecoder, atob/btoa, structuredClone, URL/URLSearchParams, performance.now, crypto
# (getRandomValues/randomUUID/subtle.digest), fetch (HTTP and verified HTTPS through lumen-tls:
# system OpenSSL on Unix, rustls on Windows). Every API is native
# lumen_bind Rust. See lib.rs for the conformance checklist.
[package]
name = "lumen-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen = { path = "../lumen", default-features = false }
lumen-bind = { path = "../lumen-bind" }
lumen-host = { path = "../lumen-host", default-features = false, features = ["webcrypto"] }
lumen-os = { path = "../lumen-os" }
lumen-common = { path = "../lumen-common", features = ["hash", "cookies", "csp", "compress"] }
lumen-codegen = { path = "../lumen-codegen" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lumen-tls = { path = "../lumen-tls" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "0.3"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[build-dependencies]
lumen = { path = "../lumen", default-features = false, features = ["compiler"] }
lumen-aot = { path = "../lumen-aot", features = ["native"] }

[features]
default = ["compiler", "jit", "aot-native", "intl", "typed"]
compiler = ["lumen-host/compiler"]
jit = ["compiler", "lumen-host/jit"]
aot-native = ["lumen-host/aot-native"]
intl = ["lumen-host/intl"]
typed = ["compiler", "lumen-host/typed"]
parallel = ["lumen-host/parallel"]

[lints]
workspace = true
