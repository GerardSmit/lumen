# WinterTC "Minimum Common Web Platform API" op crate: Event/AbortController, TextEncoder/
# TextDecoder, atob/btoa, structuredClone, URL/URLSearchParams, performance.now, crypto
# (getRandomValues/randomUUID/subtle.digest), fetch (HTTP and verified HTTPS through lumen-tls:
# system OpenSSL on Unix, rustls on Windows). Pure-JS pieces ship as js_init glue;
# Rust backs the parsing/crypto/network ops. See lib.rs for the conformance checklist.
[package]
name = "lumen-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen-host = { path = "../lumen-host" }
lumen-bind = { path = "../lumen-bind" }
lumen-os = { path = "../lumen-os" }
lumen-common = { path = "../lumen-common", features = ["hash"] }
lumen-codegen = { path = "../lumen-codegen" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lumen-tls = { path = "../lumen-tls" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "0.3"

# Build-only: used by build.rs to parse the JS glue and emit its AST snapshot (no runtime dep).
[build-dependencies]
lumen = { path = "../lumen" }

[lints]
workspace = true
