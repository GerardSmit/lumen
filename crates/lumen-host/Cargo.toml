# The substrate every lumen op crate and the runtime share: the Extension/OpDecl registration
# model (deno_core's shape), plus the two scheduling primitives (threadpool completions and
# loop-turn callbacks) that timers/fs/net are all built on. Sits *below* the op crates so the
# runtime <-> ops dependency cycle never forms. Std-only, like everything in this workspace.
[package]
name = "lumen-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen = { path = "../lumen", features = ["embed"] }
libz-rs-sys = { version = "0.6", default-features = false, features = ["std", "rust-allocator"] }
brotli = "8"

web-time = "1"

# zstd's C library does not build for wasm32-unknown-unknown without a wasm-capable clang;
# the browser build uses the pure-Rust ruzstd.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.127"
js-sys = "0.3"

[lints]
workspace = true
