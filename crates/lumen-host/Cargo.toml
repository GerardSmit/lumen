# The substrate every lumen op crate and the runtime share: the Extension/OpDecl registration
# model (deno_core's shape), plus the two scheduling primitives (threadpool completions and
# loop-turn callbacks) that timers/fs/net are all built on. Sits *below* the op crates so the
# runtime <-> ops dependency cycle never forms. Std-only, like everything in this workspace.
[package]
name = "lumen-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen = { path = "../lumen", default-features = false, features = ["embed"] }
lumen-bind = { path = "../lumen-bind" }
lumen-common = { path = "../lumen-common", features = ["compress"] }
lumen-os = { path = "../lumen-os" }

web-time = "1"

[features]
default = ["compiler", "jit", "aot-native", "intl", "typed"]
compiler = ["lumen/compiler"]
jit = ["compiler", "lumen/jit"]
aot-native = ["lumen/aot-native"]
intl = ["lumen/intl"]
typed = ["compiler", "lumen/typed"]
parallel = ["lumen/parallel"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.127"
js-sys = "0.3"

[lints]
workspace = true
