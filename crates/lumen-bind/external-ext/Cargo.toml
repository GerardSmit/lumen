# A third-party lumen extension, built OUTSIDE the lumen workspace (its own `[workspace]`), that
# depends on `lumen` (feature `embed`) and `lumen-bind` exactly as an external crate would. It
# proves the binding macros only need public paths.
#
#   cargo run --release                      # conversions / classes / promises demo (asserts)
#   cargo run --release --bin ops_bench      # macro wrapper vs hand-written NativeFn
#   cargo run --release --bin jsloop clamp   # one JS loop calling an op (instruction counts)
[package]
name = "lumen-ext-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lumen = { path = "../../lumen", features = ["embed"] }
lumen-bind = { path = ".." }

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
