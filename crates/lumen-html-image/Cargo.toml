[package]
name = "lumen-html-image"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lumen-html = { path = "../lumen-html" }
lumen-html-text = { path = "../lumen-html-text" }
lumen-common = { path = "../lumen-common", features = ["compress"] }

[lints]
workspace = true

[dev-dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde_json = "1"
lumen-common = { path = "../lumen-common", features = ["hash"] }
