<!doctype html><html><head><style>
@font-face{font-family:Test;src:url('../../../lumen-html-text/fonts/LiberationSans-Regular.ttf')}
html{background:#203040}body{margin:0;padding:4px;font-family:Test}
.row{display:flex;width:48px;height:20px;gap:4px;justify-content:space-between;align-items:center}
.a{width:8px;height:6px;background:#ff0000}.b{width:8px;height:10px;background:#008000}
.grow{display:flex;width:48px;height:8px}.c{width:8px;flex-grow:1;background:#ff8000}.d{width:8px;flex-grow:3;background:#0080ff}
.column{display:flex;flex-direction:column-reverse;width:48px;height:20px;gap:2px;align-items:center}
.e{width:4px;height:4px;background:#ffffff}.f{width:8px;height:6px;background:#ffff00}
</style></head><body><div class="row"><div class="a"></div><div class="b"></div></div><div class="grow"><div class="c"></div><div class="d"></div></div><div class="column"><div class="e"></div><div class="f"></div></div></body></html>
