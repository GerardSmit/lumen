<!doctype html><html><head><style>
html{background:#ffffff}body{margin:0}
.grid{display:grid;width:64px;grid-template-columns:12px 1fr 2fr;grid-template-rows:16px 20px;gap:2px}
.a{grid-column:2 / span 2;background:#ff0000}
.b{background:#00ff00}
.c{background:#0000ff}
.d{background:#ff8000}
</style></head><body><div class="grid"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div></body></html>
