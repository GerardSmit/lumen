<!doctype html><style>
html,body{margin:0;background:#fff}
#cb{position:relative;width:400px;height:280px;background:#f1f3f4}
#a{position:absolute;left:150px;top:110px;width:100px;height:60px;anchor-name:--a;background:#174ea6}
.t{position:absolute;position-anchor:--a;width:24px;height:18px}
#tl{position-area:top left;background:#34a853}
#br{position-area:bottom right;background:#fbbc04}
#c{position-area:center;background:#ea4335}
#spanx{position-area:top span-all;background:#a142f4}
#logical{position-area:block-end inline-start;background:#00838f}
#spanband{position-area:span-left bottom;justify-self:start;background:#5f6368}
#filled{position-area:right;width:100%;height:12px;background:#c5221f}
</style><div id=cb>
<div id=a></div>
<div class=t id=tl></div><div class=t id=br></div><div class=t id=c></div>
<div class=t id=spanx></div><div class=t id=logical></div><div class=t id=spanband></div>
<div class=t id=filled></div>
</div>
