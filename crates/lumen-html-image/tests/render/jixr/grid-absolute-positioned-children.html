<!doctype html>
<!-- jixr-compare: threshold=32 max-diff-ratio=0 -->
<style>
html,body{margin:0;background:#fff}
.g{display:grid;width:200px;height:140px;grid-template-columns:80px 80px;grid-template-rows:50px 50px;gap:10px;grid-template-areas:"tl br" "bl br";background:#eee;margin:10px;position:relative}
.a{position:absolute;grid-column:2;grid-row:2;width:40px;height:30px;background:#ff0000}
.b{position:absolute;grid-column:1 / 3;grid-row:1;width:60px;height:20px;background:#00ff00}
.c{position:absolute;grid-area:br;width:30px;height:20px;background:#0000ff}
.d{position:absolute;grid-column:1;grid-row:1;left:5px;top:5px;width:30px;height:20px;background:#ffff00}
.e{position:absolute;grid-column:1;grid-row:2;right:0;bottom:0;width:30px;height:20px;background:#ff00ff}
</style>
<div class=g><div class=a></div><div class=b></div><div class=c></div><div class=d></div><div class=e></div></div>
<div class=g><div class=a></div><div class=b></div><div class=c></div><div class=d></div><div class=e></div></div>
<div style="height:6px"></div>
<style>
.g2{display:grid;width:200px;grid-template-columns:80px 80px;gap:10px;background:#ddd;margin:10px;position:relative}
.ab{position:absolute;grid-column:2;grid-row:1;width:40px;height:30px;background:#ff0000}
.bb{height:30px;background:#00ff00}
.cb{height:30px;background:#0000ff}
</style>
<div class=g2><div class=ab></div><div class=bb></div><div class=cb></div></div>
