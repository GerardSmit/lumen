<!doctype html><style>
html,body{margin:0;background:#fff}
.g{display:grid;grid-template-columns:[main-start] 60px [main-end] 60px;grid-template-rows:[row-start] 40px [row-end] 40px;gap:10px;width:130px;background:#e8eef8}
.a{background:#174ea6;grid-column:main-start / main-end}
.b{background:#fbbc04}
.c{background:#34a853;grid-row:row-start / row-end}
</style><div class=g><div class=a></div><div class=b></div><div class=c></div></div>
