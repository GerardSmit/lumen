<!doctype html><style>
html,body{margin:0;background:#fff}
.flex{display:flex;width:280px;height:80px;gap:12px;background:#e8eef8}
.flex>div{width:60px;height:40px;background:#174ea6}
.flex>div:nth-child(2){height:20px;align-self:center;background:#fbbc04}
.flex>div:nth-child(3){height:30px;align-self:flex-end;background:#34a853}
.flex>div:nth-child(4){height:auto;align-self:stretch;background:#a142f4}
</style><div class=flex><div></div><div></div><div></div><div></div></div>
