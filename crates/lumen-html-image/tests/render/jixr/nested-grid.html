<!doctype html><style>
html,body{margin:0;background:#fff}
.outer{display:grid;grid-template-columns:100px 100px;grid-template-rows:40px 40px;gap:10px;width:210px;background:#e8eef8}
.outer>div:nth-child(1){background:#dbe7ff}.outer>div:nth-child(2){background:#fbbc04}.outer>div:nth-child(3){background:#34a853}.outer>div:nth-child(4){background:#a142f4}
.inner{display:grid;grid-template-columns:40px 40px;grid-template-rows:24px;gap:4px;width:84px;height:24px;background:#174ea6}
.inner>div:nth-child(1){background:#ea4335}.inner>div:nth-child(2){background:#00acc1}
</style><div class=outer><div><div class=inner><div></div><div></div></div></div><div></div><div></div><div></div></div>
