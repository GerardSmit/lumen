<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  #m {
    position: absolute;
    left: 20px;
    top: 20px;
    width: 300px;
    height: 120px;
    padding: 10px 0;
    background: #eeeeee;
    column-count: 3;
    column-gap: 30px;
    column-rule: 6px solid #b31412;
  }
  .block { height: 40px; background: #cfd8f0; }
</style>
</head>
<body>
  <div id="m">
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
  </div>
</body>
</html>
