<!doctype html>
<!-- jixr-compare: threshold=128 max-diff-ratio=0.02
     The corner miter diagonals antialias: two bands each cover part of a corner pixel, so a
     blended pixel is lighter than Chromium's single filled path. 52 of 64,000 pixels on Window
     and ImageSharp, 697 on the PDF raster, all on the four corner diagonals. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  .box {
    position: absolute;
    background: #dddddd;
    border-style: double;
  }
  #widths {
    left: 20px; top: 20px; width: 120px; height: 80px;
    border-color: #b31412;
    border-width: 12px 7px 9px 10px;
  }
  #mixed {
    left: 20px; top: 140px; width: 120px; height: 60px;
    border-color: #1a73e8;
    border-width: 9px;
    border-top-style: solid;
  }
  #thin {
    left: 180px; top: 20px; width: 80px; height: 60px;
    border-color: #188038;
    border-width: 2px;
  }
</style>
</head>
<body>
  <div class="box" id="widths"></div>
  <div class="box" id="mixed"></div>
  <div class="box" id="thin"></div>
</body>
</html>
