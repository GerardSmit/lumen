<!doctype html><style>
html,body{margin:0;background:#fff}
.flex{display:flex;width:280px;height:50px;gap:10px;background:#e8eef8}
.flex>div{width:60px;height:30px}
.flex>div:nth-child(1){order:2;background:#174ea6}
.flex>div:nth-child(2){order:0;background:#fbbc04}
.flex>div:nth-child(3){order:1;background:#34a853}
</style><div class=flex><div></div><div></div><div></div></div>
