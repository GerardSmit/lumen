<!doctype html><style>
html,body{margin:0;background:#fff}
.grid{display:grid;grid-template-columns:60px 60px;grid-template-rows:40px 40px 40px;gap:10px;width:130px;background:#e8eef8}
.grid>div:nth-child(1){background:#174ea6;grid-row:2 / 4}
.grid>div:nth-child(2){background:#fbbc04}
.grid>div:nth-child(3){background:#34a853}
</style><div class=grid><div></div><div></div><div></div></div>
