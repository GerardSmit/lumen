<!DOCTYPE html>
<html>
<head>
<style>
html, body { margin: 0; background: #fff; line-height: 0; }
.row { width: 200px; }
.chip { display: inline-block; width: 40px; height: 20px; }
.f { float: left; width: 50px; height: 20px; background: #00c; }
.wide { float: left; width: 150px; height: 20px; background: #0cc; }
</style>
</head>
<body>
<div class="row"><span class="chip" style="background:#c00"></span><span class="f"></span><span class="chip" style="background:#0c0"></span></div>
<div class="row"><span class="chip" style="background:#cc0"></span><span class="wide"></span><span class="chip" style="background:#c0c"></span></div>
</body>
</html>
