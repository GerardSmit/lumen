<!doctype html><style>
html,body{margin:0;background:#fff}
.scroll{width:240px;height:140px;background:#e8eef8;padding:10px;overflow:auto}
.before{background:#34a853;height:50px;width:120px}
.sticky{position:sticky;top:8px;background:#174ea6;height:40px;width:120px;margin-top:12px}
.after{background:#fbbc04;height:30px;width:120px;margin-top:12px}
</style>
<div class=scroll><div class=before></div><div class=sticky></div><div class=after></div></div>
