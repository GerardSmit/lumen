<!doctype html><style>
html,body{margin:0;background:#fff}
#cb{position:relative;width:400px;height:260px;background:#f1f3f4}
#a{position:absolute;left:100px;top:80px;width:120px;height:60px;anchor-name:--a;background:#174ea6}
.t{position:absolute;position-anchor:--a}
#edge{left:anchor(right);top:anchor(bottom);width:30px;height:20px;background:#34a853}
#opposite{right:anchor(left);bottom:anchor(top);width:30px;height:20px;background:#fbbc04}
#sized{left:anchor(center);top:anchor(50%);width:anchor-size(width);height:anchor-size(height);background:#c8a2f7}
#offset{left:calc(anchor(right) + 10px);top:anchor(top);width:10px;height:10px;background:#ea4335}
#fallback{left:anchor(--missing right, 7px);top:0;width:10px;height:10px;background:#000}
</style><div id=cb>
<div id=a></div>
<div class=t id=edge></div><div class=t id=opposite></div><div class=t id=sized></div>
<div class=t id=offset></div><div class=t id=fallback></div>
</div>
