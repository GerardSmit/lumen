<!doctype html>
<style>
html,body{margin:0;background:#fff}
.stage{position:relative;width:320px;height:200px;background:#e8eef8}
.clip{position:absolute;width:50px;height:40px;overflow:clip;background:#174ea6}
.clip>i{display:block;position:absolute;left:0;top:0;width:70px;height:60px;margin:-10px 0 0 -10px;background:#fbbc04}
/* These cover each reference box accepted by overflow-clip-margin. */
.padding{left:110px;top:30px;overflow-clip-margin:10px}
.border{left:200px;top:30px;border:5px solid #34a853;overflow-clip-margin:border-box 10px}
.content{left:110px;top:120px;padding:5px;border:5px solid #ea4335;overflow-clip-margin:content-box 10px}
</style>
<div class=stage>
  <div class="clip padding"><i></i></div>
  <div class="clip border"><i></i></div>
  <div class="clip content"><i></i></div>
</div>
