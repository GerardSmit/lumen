<!doctype html><style>
html,body{margin:0;background:#fff}
.g{display:grid;grid-template-columns:60px 60px;grid-template-rows:50px 50px;width:200px;height:150px;gap:10px;background:#e8eef8;margin-bottom:8px;align-content:center}
.g1{align-content:space-between}
.g2{align-content:end;justify-content:end}
.item{width:30px;height:20px}
.item:nth-child(1){background:#174ea6;align-self:start}
.item:nth-child(2){background:#fbbc04;align-self:center;justify-self:end}
.item:nth-child(3){background:#34a853;justify-self:center}
.item:nth-child(4){background:#d93025;align-self:end}
</style><div class="g g1"><div class=item></div><div class=item></div><div class=item></div><div class=item></div></div><div class="g g2"><div class=item></div><div class=item></div><div class=item></div><div class=item></div></div>
