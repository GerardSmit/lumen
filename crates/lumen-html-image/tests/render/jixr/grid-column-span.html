<!doctype html><style>
html,body{margin:0;background:#fff}
.grid{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:40px 40px;gap:10px;width:200px;background:#e8eef8}
.grid>div:nth-child(1){background:#174ea6;grid-column:span 2}
.grid>div:nth-child(2){background:#fbbc04}
.grid>div:nth-child(3){background:#34a853}
.grid>div:nth-child(4){background:#a142f4}
</style><div class=grid><div></div><div></div><div></div><div></div></div>
