<!doctype html>
<style>
  html, body { margin: 0; width: 200px; height: 40px; }
  body { display: flex; }
  div { width: 40px; height: 40px; }
  .gray { background: rgb(255, 0, 0); filter: grayscale(100%); }
  .bright { background: rgb(32, 64, 96); filter: brightness(150%); }
  .invert { background: rgb(32, 96, 160); filter: invert(100%); }
  .hue { background: rgb(255, 0, 0); filter: hue-rotate(120deg); }
  .ordered { background: rgb(128, 128, 128); filter: brightness(50%) invert(100%); }
</style>
<div class="gray"></div><div class="bright"></div><div class="invert"></div><div class="hue"></div><div class="ordered"></div>
