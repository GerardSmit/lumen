<!doctype html>
<style>
  html, body { margin: 0; width: 320px; height: 200px; }
  .host { position: absolute; left: 10px; top: 10px; width: 160px; height: 60px; --density: compact; --enabled: yes; background: #dbeafe; }
  .card { width: 80px; height: 40px; background: #dc2626; }
  @container style(--density: compact) {
    .card { background: #16a34a; }
  }
  @container style(--enabled) {
    .card { border: 4px solid #1d4ed8; }
  }
</style>
<div class="host"><div class="card"></div></div>
