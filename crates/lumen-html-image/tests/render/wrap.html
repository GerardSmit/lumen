<!doctype html><html><head><style>
html{background:#203040}body{margin:0;padding:0}
.row{display:flex;flex-wrap:wrap;width:24px;gap:2px;align-items:center}
.a{width:10px;height:4px;flex-grow:1;background:#ff0000}.b{width:10px;height:8px;flex-grow:1;background:#008000}.c{width:10px;height:6px;flex-grow:1;background:#ff8000}
.fixed{display:flex;flex-wrap:wrap;width:20px;height:30px;gap:2px}.d{width:12px;height:4px;background:#ffffff}.e{width:12px;background:#ffff00}
.column{display:flex;flex-direction:column;flex-wrap:wrap;width:30px;height:10px;gap:2px;align-items:start}.f{width:4px;height:6px;background:#0080ff}.g{width:8px;height:6px;background:#ff00ff}
</style></head><body><div class="row"><div class="a"></div><div class="b"></div><div class="c"></div></div><div class="fixed"><div class="d"></div><div class="e"></div></div><div class="column"><div class="f"></div><div class="g"></div></div></body></html>
