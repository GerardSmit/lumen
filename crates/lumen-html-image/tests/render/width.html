<!doctype html><html><head><style>
html{background:#203040}body{margin:0;padding:0}
.min{width:10px;min-width:20px;max-width:5px;height:4px;background:#ff0000}
.max{max-width:12px;height:4px;background:#008000}
.border{box-sizing:border-box;min-width:20px;width:8px;padding:2px;height:8px;background:#ff8000}
.grow{display:flex;width:50px}.a{width:10px;max-width:15px;flex-grow:1;height:4px;background:#ffffff}.b{width:10px;flex-grow:1;height:4px;background:#ffff00}
.shrink{display:flex;width:40px}.c{width:30px;min-width:25px;height:4px;background:#0080ff}.d{width:30px;height:4px;background:#ff00ff}
</style></head><body><div class="min"></div><div class="max"></div><div class="border"></div><div class="grow"><div class="a"></div><div class="b"></div></div><div class="shrink"><div class="c"></div><div class="d"></div></div></body></html>
