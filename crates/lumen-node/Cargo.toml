# node: compatibility: a CommonJS require() with node_modules resolution, the node:path/os/fs
# builtins, and Buffer — so npm packages written for CommonJS run on lumen. The module system,
# path, Buffer, and the node:fs shim are pure-JS glue (js_init); Rust backs only the host
# probes (fs is-file/is-dir/read, OS info) that JS can't do. Std-only.
[package]
name = "lumen-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen-host = { path = "../lumen-host" }
lumen-tls = { path = "../lumen-tls" }
# The binding macros (#[lumen::op] / #[class]) name `::lumen::embed` paths, so the crate is a
# direct dependency (lumen-host already links it).
lumen = { path = "../lumen", features = ["macros"] }

# Build-only: used by build.rs to parse the JS glue and emit its AST snapshot (no runtime dep).
[build-dependencies]
lumen = { path = "../lumen" }

# Optional builtins (all on by default). Embedders and mobile builds can turn them off with
# `default-features = false` (through lumen-runtime's features of the same names).
[features]
default = ["bun", "http2", "cluster", "dgram", "wasi"]
# Bun APIs: `bun`, `bun:ffi` (the native-call trampolines), `bun:sqlite`, `bun:jsc`, Bun.hash, …
bun = []
http2 = []
cluster = []
dgram = []
wasi = []

[lints]
workspace = true
