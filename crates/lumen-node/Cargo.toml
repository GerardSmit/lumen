# node: compatibility: a CommonJS require() with node_modules resolution, the node:path/os/fs
# builtins, and Buffer — so npm packages written for CommonJS run on lumen. The module system,
# path, Buffer, and the node:fs shim are pure-JS glue (js_init); Rust backs only the host
# probes (fs is-file/is-dir/read, OS info) that JS can't do. Std-only.
[package]
name = "lumen-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen-host = { path = "../lumen-host" }
lumen-common = { path = "../lumen-common", features = ["hash"] }
lumen-os = { path = "../lumen-os" }
# RSA, DSA, finite-field DH, primes and their key generation: OpenSSL first, RustCrypto as fallback.
lumen-crypto = { path = "../lumen-crypto" }
# Natives are declared with lumen-bind and exposed through lumen's JS host (`embed`).
lumen = { path = "../lumen", features = ["embed"] }
lumen-bind = { path = "../lumen-bind" }

# node:crypto and crypto.subtle: RustCrypto for ciphers, EC and EdDSA on every platform (native and wasm32); lumen carries
# no cryptography of its own.
scrypt = { version = "0.11", default-features = false }
argon2 = "0.5"
bcrypt = { version = "0.17", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
subtle = { version = "2.4", default-features = false }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
aes = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
cfb-mode = "0.8"
cfb8 = "0.8"
ofb = "0.6"
aes-gcm = "0.10"
ccm = "0.5"
aes-kw = { version = "0.2", features = ["alloc"] }
chacha20 = "0.9"
chacha20poly1305 = "0.10"
ghash = "0.5"
poly1305 = "0.8"
ocb3 = "0.1"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem", "jwk"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem", "jwk"] }
p521 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem", "jwk"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem", "jwk"] }
ed448-goldilocks-plus = { version = "0.16", default-features = false, features = ["signing", "pkcs8", "zeroize"] }
pkcs5 = { version = "0.7", features = ["pbes2", "3des", "des-insecure", "sha1-insecure", "alloc"] }
ecdsa = { version = "0.16", features = ["der", "signing", "verifying", "pkcs8", "pem", "digest"] }
elliptic-curve = { version = "0.13", features = ["sec1", "pkcs8", "pem", "jwk", "ecdh"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
signature = "2"
pkcs1 = { version = "0.7", features = ["pem", "alloc"] }
pkcs8 = { version = "0.10", features = ["pem", "alloc", "encryption"] }
spki = { version = "0.7", features = ["pem", "alloc"] }
sec1 = { version = "0.7", features = ["pem", "alloc", "der"] }
der = { version = "0.7", features = ["alloc", "oid", "pem"] }
x509-cert = "0.2"
num-bigint-dig = { version = "0.8", features = ["prime", "rand"] }
digest = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libsqlite3-sys = { version = "0.37", optional = true, features = ["bundled", "column_metadata"] }
lumen-tls = { path = "../lumen-tls" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Build-only: used by build.rs to parse the JS glue and emit its AST snapshot (no runtime dep).
[build-dependencies]
lumen = { path = "../lumen" }

# Optional builtins (all on by default). Embedders and mobile builds can turn them off with
# `default-features = false` (through lumen-runtime's features of the same names).
[features]
default = ["bun", "http2", "cluster", "dgram", "wasi"]
# Bun APIs: `bun`, `bun:ffi` (the native-call trampolines), `bun:sqlite`, `bun:jsc`, Bun.hash, …
bun = []
# Pin a portable SQLite implementation rather than the device OS library.
bundled-sqlite = ["dep:libsqlite3-sys"]
http2 = []
cluster = []
dgram = []
wasi = []

[lints]
workspace = true
