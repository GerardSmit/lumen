# WebAssembly bindings for the playground (https://lucid-softworks.github.io/lumen/). Not published;
# built by .github/workflows/pages.yml with wasm-pack.
[package]
name = "lumen-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lumen = { path = "../lumen" }
lumen-host = { path = "../lumen-host", optional = true }
lumen-runtime = { path = "../lumen-runtime", optional = true }
wasm-bindgen = "=0.2.127"
js-sys = "0.3"

# `runtime` adds `RuntimeSession`: the Node/Web runtime (lumen-runtime) on the single-threaded,
# embedder-driven event loop. The bare-engine `Session` the playground uses is always present.
[features]
default = []
runtime = ["dep:lumen-host", "dep:lumen-runtime"]

[lints]
workspace = true
