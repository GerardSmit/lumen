# The runtime spine: assembles an Engine + extensions and owns the event loop (the engine is
# !Send, so one loop thread owns it; blocking work runs on lumen-host's threadpool and comes
# back as mpsc completions). Also home to the light host globals that don't earn their own
# crate yet: the streaming console and a minimal `process`. Std-only.
[package]
name = "lumen-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen = { path = "../lumen" }
lumen-fs = { path = "../lumen-fs" }
lumen-host = { path = "../lumen-host" }
lumen-node = { path = "../lumen-node", default-features = false }
lumen-timers = { path = "../lumen-timers" }
lumen-web = { path = "../lumen-web" }

[dev-dependencies]
# tests/async_ops.rs binds its ops with #[lumen::op].
lumen = { path = "../lumen", features = ["macros"] }

# lumen-node's optional builtins (see its Cargo.toml), all on by default.
[features]
default = ["bun", "http2", "cluster", "dgram", "wasi"]
bun = ["lumen-node/bun"]
http2 = ["lumen-node/http2"]
cluster = ["lumen-node/cluster"]
dgram = ["lumen-node/dgram"]
wasi = ["lumen-node/wasi"]

[lints]
workspace = true

[[bench]]
name = "runtime"
harness = false
