# The runtime spine: assembles an Engine + extensions and owns the event loop (the engine is
# !Send, so one loop thread owns it; blocking work runs on lumen-host's threadpool and comes
# back as mpsc completions). Also home to the light host globals that don't earn their own
# crate yet: the streaming console and a minimal `process`. Std-only.
[package]
name = "lumen-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lumen-common = { path = "../lumen-common" }
lumen = { path = "../lumen", default-features = false }
lumen-host = { path = "../lumen-host", default-features = false }
lumen-node = { path = "../lumen-node", default-features = false }
lumen-os = { path = "../lumen-os" }
lumen-timers = { path = "../lumen-timers" }
lumen-web = { path = "../lumen-web", default-features = false }

# Build-only: build.rs precompiles the embedded JS (no runtime dep).
[build-dependencies]
lumen = { path = "../lumen" }
lumen-aot = { path = "../lumen-aot", features = ["native"] }

[dev-dependencies]
# tests/async_ops.rs binds its ops with lumen-bind.
lumen-bind = { path = "../lumen-bind" }

# lumen-node's optional builtins (see its Cargo.toml), all on by default.
[features]
default = ["compiler", "jit", "aot-native", "intl", "typed", "bun", "http2", "cluster", "dgram", "wasi"]
compiler = ["lumen/compiler", "lumen-host/compiler", "lumen-node/compiler", "lumen-web/compiler"]
jit = ["compiler", "lumen/jit", "lumen-host/jit", "lumen-node/jit", "lumen-web/jit"]
aot-native = ["lumen/aot-native", "lumen-host/aot-native", "lumen-node/aot-native", "lumen-web/aot-native"]
intl = ["lumen/intl", "lumen-host/intl", "lumen-node/intl", "lumen-web/intl"]
typed = ["compiler", "lumen/typed", "lumen-host/typed", "lumen-node/typed", "lumen-web/typed"]
parallel = ["lumen/parallel", "lumen-host/parallel", "lumen-node/parallel", "lumen-web/parallel"]
bun = ["lumen-node/bun"]
bundled-sqlite = ["lumen-node/bundled-sqlite"]
http2 = ["lumen-node/http2"]
cluster = ["lumen-node/cluster"]
dgram = ["lumen-node/dgram"]
wasi = ["lumen-node/wasi"]

[lints]
workspace = true

[[bench]]
name = "runtime"
harness = false
