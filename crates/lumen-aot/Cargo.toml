# Ahead-of-time compilation of JavaScript for lumen embedders: `include_js!` turns JS files (a
# script, or an ES module graph walked from an entry) into a source-free precompiled blob at
# compile time; `build` does the same from a build script. Load it with
# `lumen::Engine::load_precompiled`.
[package]
name = "lumen-aot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lumen = { path = "../lumen", default-features = false, features = ["compiler"] }
lumen-common = { path = "../lumen-common" }
# `.ts`/`.mts`/`.cts` sources are type-stripped (offsets kept) before compiling.
lumen-aot-macros = { path = "macros" }
lumen-codegen = { path = "../lumen-codegen", optional = true }

[features]
native = ["lumen/jit", "lumen/aot-native", "lumen-common/native-sidecar", "dep:lumen-codegen", "lumen-codegen/standalone-object"]

[dev-dependencies]
# examples/aot_node.rs runs a node_modules bundle on the Node runtime.
lumen-runtime = { path = "../lumen-runtime" }

[lints]
workspace = true
