[workspace]
resolver = "2"
members = [
    "crates/cpython-test-runner",
    "crates/lumen",
    "crates/lumen-aot",
    "crates/lumen-cli",
    "crates/lumen-codegen",
    "crates/lumen-bind",
    "crates/lumen-bind/macros",
    "crates/lumen-common",
    "crates/lumen-crypto",
    "crates/lumen-difftest",
    "crates/lumen-exe-runtime",
    "crates/lumen-host",
    "crates/lumen-html",
    "crates/lumen-html-image",
    "crates/lumen-html-js",
    "crates/lumen-html-text",
    "crates/lumen-node",
    "crates/lumen-os",
    "crates/lumen-py",
    "crates/lumen-repl",
    "crates/lumen-runtime",
    "crates/lumen-timers",
    "crates/lumen-tls",
    "crates/lumen-web",
    "crates/lumen-webstreams",
    "crates/lumen-wasm",
    "crates/node-compat-runner",
    "crates/test262-runner",
]

[patch.crates-io]
# Upstream 0.16.0's profile-only edcstat module uses Vec without importing it
# from alloc, which breaks its supported no_std + alloc configuration.
rusty_h264-decoder = { path = "vendor/rusty_h264-decoder-0.16.0" }

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lumen_op_stats)'] }

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`). Two lints
# fight the nature of an engine — deeply nested callback / `dyn Fn` types and pipeline functions
# that legitimately take many parameters — everything else stays denied in CI
# (`cargo clippy -- -D warnings`).
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
doc_lazy_continuation = "allow"
needless_range_loop = "allow"

# Optimize the release build of the engine; debug stays fast to compile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Fast-building optimized profile for day-to-day work and agents: `--profile fast`. Same
# opt-level as release, but no LTO and parallel codegen, so a change to `lumen` rebuilds in a
# fraction of the time. Binaries are a little slower than `release`; use `release` for final
# benchmark numbers and A/B both sides with the same profile.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 64
incremental = true


# Keep the large native DOM test harness below Mach-O compact-unwind limits.
# Optimize only this test package; preserve assertions and ordinary dev builds.
[profile.test.package.lumen-html-js]
opt-level = 1

# CI tests: optimized like `fast` so deep-recursion tests fit the stack, but keep debug assertions
# and overflow checks.
[profile.ci]
inherits = "fast"
debug-assertions = true
overflow-checks = true

# Size-focused release build for shipping (mobile, WASM, embedders): `--profile release-small`.
# Everything is optimized for size except the engine core (`lumen`: interpreter, VM, builtins),
# which stays at opt-level 3 — the hot paths live there. panic = "abort" is inherited (the
# engine does not rely on unwinding). `strip` drops symbols from the binary (debug info for
# crash symbolication is still available via separate PDB / split-debuginfo where supported).
[profile.release-small]
inherits = "release"
opt-level = "s"
strip = true

[profile.release-small.package.lumen]
opt-level = 3
