[package]
name = "lumen-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lumen-common = { path = "../crates/lumen-common" }
lumen-html = { path = "../crates/lumen-html" }
lumen-html-image = { path = "../crates/lumen-html-image" }
lumen-html-text = { path = "../crates/lumen-html-text", default-features = false, features = ["std"] }
lumen = { path = "../crates/lumen", features = ["bench"] }
lumen-runtime = { path = "../crates/lumen-runtime", optional = true }

[features]
default = ["runtime"]
runtime = ["dep:lumen-runtime"]

# Not part of the main workspace: needs nightly + libfuzzer and has its own lockfile.
[workspace]
members = []

[profile.release]
debug = 1
panic = "abort"

[[bin]]
name = "precompiled"
path = "fuzz_targets/precompiled.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm_decode"
path = "fuzz_targets/wasm_decode.rs"
required-features = ["runtime"]
test = false
doc = false
bench = false

[[bin]]
name = "json_parse"
path = "fuzz_targets/json_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regexp_compile"
path = "fuzz_targets/regexp_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "js_parse"
path = "fuzz_targets/js_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsx_parse"
path = "fuzz_targets/jsx_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_decode"
path = "fuzz_targets/snapshot_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_parse"
path = "fuzz_targets/html_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css_parse"
path = "fuzz_targets/css_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_selectors"
path = "fuzz_targets/html_selectors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_render"
path = "fuzz_targets/html_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_decode"
path = "fuzz_targets/image_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_shape"
path = "fuzz_targets/font_shape.rs"
test = false
doc = false
bench = false

[[bin]]
name = "untrusted_html"
path = "fuzz_targets/untrusted_html.rs"
test = false
doc = false
bench = false

# Must mirror `[patch.crates-io]` in `../Cargo.toml`: this crate is not a workspace member, so
# cargo does not inherit the root patches.
[patch.crates-io]
content-security-policy = { path = "../vendor/content-security-policy-0.9.0" }
image = { path = "../vendor/image-0.25.10" }
tiny-skia = { path = "../vendor/tiny-skia-0.11.4" }
tiny-skia-path = { path = "../vendor/tiny-skia-path-0.11.4" }
rusty_h264-decoder = { path = "../vendor/rusty_h264-decoder-0.16.0" }
